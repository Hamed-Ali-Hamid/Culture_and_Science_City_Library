<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture and Science City Library</title>
  <link href="Image.gif" type="imag/x-icon" rel="icon" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== صفحة تسجيل الدخول ====== -->
  <section id="login" class="form">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="loginPass" placeholder="كلمة المرور">
    <button onclick="login()">تسجيل الدخول</button>
    <p>ليس لديك حساب؟ <a onclick="showSignup()">إنشاء حساب</a></p>
  </section>

  <!-- ====== صفحة إنشاء حساب ====== -->
  <section id="signup" class="form" style="display:none;">
    <h2>إنشاء حساب جديد</h2>
    <input type="text" id="firstName" placeholder="الاسم الأول">
    <input type="text" id="lastName" placeholder="الاسم الثاني">
    <input type="number" id="age" placeholder="العمر">
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
    <button onclick="signup()">إنشاء الحساب</button>
    <p>لديك حساب؟ <a onclick="showLogin()">تسجيل الدخول</a></p>
  </section>

  <!-- ====== الصفحة الرئيسية ====== -->
  <section id="home">
    <header>
      <h2>📖 Culture and Science City Library</h2>
      <input type="text" id="search" placeholder="ابحث عن كتاب...">
      <button onclick="showFavorites()">المفضلة ❤️</button>
    </header>

    <div class="container">
      <div class="categories">
        <button onclick="filterBooks('all')">الكل</button>
        <button onclick="filterBooks('روايات')">روايات</button>
        <button onclick="filterBooks('علمي')">علمي</button>
        <button onclick="filterBooks('تاريخي')">تاريخي</button>
        <button onclick="filterBooks('ديني')">ديني</button>
      </div>

      <div class="books" id="bookList"></div>
    </div>
  </section>

  <!-- ====== صفحة المفضلة ====== -->
  <section id="favorites">
    <header>
      <h2>❤️ المفضلة</h2>
      <button onclick="backHome()">⬅ رجوع</button>
    </header>
    <div class="container">
      <div class="books" id="favList"></div>
    </div>
  </section>
<footer class="site-footer">
  <a href="https://csi.edu.eg/" target="_blank" class="uni-link">
    <img src="https://github.com/Hamed-Ali-Hamid/Culture_and_Science_City_Library/blob/main/Image.gif?raw=true" alt="موقع مدينة الثقافة والعلوم">
  </a>
  <p>موقع مدينة الثقافة والعلوم</p>
</footer>



  <script src="script.js"></script>
</body>
</html>
